name: CI

on:
  push:
    branches: [ main, master ]
    # Skip CI on tag pushes to prevent infinite loop with release workflow
    tags:
      - '!v*'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (1.95)
        run: |
          rustup update stable
          rustup default 1.95
          rustup component add rustfmt clippy llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Deep Lint (Clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Tests and Generate HTML Report
        run: cargo llvm-cov --all-features --html

      - name: Preparation for HTML Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # В llvm-cov отчеты по дефолту падают в target/llvm-cov/html
          touch target/llvm-cov/html/.nojekyll

      - name: Deploy Coverage Report to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: target/llvm-cov/html
          git-config-name: "github-actions[bot]"
          git-config-email: "github-actions[bot]@://github.com"
          single-commit: true

  create-release-tag:
    needs: quality-and-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump version and create tag
        shell: bash
        run: |
          # Read current version from Cargo.toml
          CURRENT_VERSION=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

          echo "Bumping version: ${CURRENT_VERSION} -> ${NEW_VERSION}"

          # Update Cargo.toml
          sed -i "s/version = \"${CURRENT_VERSION}\"/version = \"${NEW_VERSION}\"/" Cargo.toml

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit version bump
          git add Cargo.toml
          git commit -m "chore: bump version to ${NEW_VERSION}" || echo "No version changes to commit"

          # Create and push tag
          git tag "v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"
